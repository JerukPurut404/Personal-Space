name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 2222
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_TARGET_DIR }}
            
            # 1. Ignore permission-only changes
            git config core.fileMode false
            
            # 2. If you added blogs/photos/edits in the CMS, commit them first
            git add json/ media/ blog/
            git diff --staged --quiet || git commit -m "Auto-save CMS content from VPS"
            
            # 3. Pull latest code from GitHub (preferring VPS content if both edited the same JSON line)
            git pull --no-rebase -X ours origin main
            
            # 4. Push any CMS content back to GitHub so your repo stays backed up
            git push origin main
            
            # 5. Fix permissions for Alpine PHP (www-data UID 82)
            chown -R 82:82 json/ media/ blog/ admin/
            chmod -R 775 json/ media/ blog/
            
            # 6. Restart containers if needed
            docker compose up -d